# Supabase project settings used by the CLI. The project itself lives in the Supabase dashboard.
project_id = "yigaoluganda"

[auth]
site_url = "https://app.yigaoluganda.com"
additional_redirect_urls = ["https://app.yigaoluganda.com/**", "http://localhost:8081/**"]
minimum_password_length = 8

[auth.email]
enable_confirmations = true

# Stripe calls the webhook without a Supabase login; the function checks Stripe's signature instead.
[functions.stripe-webhook]
verify_jwt = false

# Called by pg_cron (with a shared secret) and by unsubscribe links in e-mails.
[functions.reminders]
verify_jwt = false

# Branded e-mails in the learner's language (paste the same into the dashboard's Email Templates).
[auth.email.template.confirmation]
subject = "{{ if eq .Data.ui_lang \"sv\" }}Bekräfta ditt konto{{ else }}Confirm your account{{ end }} · Yiga Oluganda"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "{{ if eq .Data.ui_lang \"sv\" }}Välj ett nytt lösenord{{ else }}Choose a new password{{ end }} · Yiga Oluganda"
content_path = "./supabase/templates/recovery.html"
