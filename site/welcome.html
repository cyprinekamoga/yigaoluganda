<!doctype html>
<html lang="sv" data-lang="sv">

<body data-page="welcome" class="page">

<main>
  <div class="wrap narrow">
    <div class="panel">
      <img class="mascot" src="/img/icon.svg" alt="">

        <button class="btn block" type="button" data-retry><span data-l="sv">Försök igen</span><span data-l="en">Try again</span></button>

    </div>
  </div>
