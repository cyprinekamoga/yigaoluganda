<!doctype html>
<html lang="sv" data-lang="sv">
<head>
<title>Nytt lösenord – Yiga Oluganda</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e6f73">
<meta name="robots" content="noindex">
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/grandstander.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="/site.css">
</head>
<body data-page="reset" class="page">
<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><img src="/img/icon.svg" alt="">Yiga Oluganda</a>
    <nav><button class="lang" type="button" data-lang-toggle><span data-l="sv">English</span><span data-l="en">Svenska</span></button></nav>
  </div>
</header>
<main>
  <div class="wrap narrow">
    <div class="panel">
      <img class="mascot" src="/img/icon.svg" alt="">
      <form data-form="reset" novalidate>
        <h1><span data-l="sv">Välj ett nytt lösenord</span><span data-l="en">Choose a new password</span></h1>
        <label for="pw1"><span data-l="sv">Nytt lösenord (minst 8 tecken)</span><span data-l="en">New password (at least 8 characters)</span></label>
        <input id="pw1" name="pw1" type="password" autocomplete="new-password" minlength="8" required>
        <label for="pw2"><span data-l="sv">Skriv det igen</span><span data-l="en">Type it again</span></label>
        <input id="pw2" name="pw2" type="password" autocomplete="new-password" minlength="8" required>
        <p class="msg err" data-error hidden></p>
        <button class="btn go block" type="submit" style="margin-top:20px"><span data-l="sv">Spara och logga in</span><span data-l="en">Save and log in</span></button>
      </form>
      <p class="fine"><a href="/forgot.html"><span data-l="sv">Be om en ny länk</span><span data-l="en">Ask for a new link</span></a></p>
    </div>
  </div>
</main>
<script src="/site.js" defer></script>
</body>
</html>
