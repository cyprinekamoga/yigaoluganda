# The web app, deployed to its own Netlify site at app.yigaoluganda.com.
# It is separate from the landing page site (yigaoluganda.com), so a broken
# app deploy can never take the landing page down.

[build]
  command = "npm run export:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Accounts and payments (both values are public; without them the app runs without accounts).
  EXPO_PUBLIC_SUPABASE_URL = "https://qbagcpemtsqaoykwqger.supabase.co"
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_uYoU_bNVB5jhL3_nPzegBQ_DqqKF4KJ"
  # "Continue with Google": the public client id of the Google Cloud web client (empty: no button).
  EXPO_PUBLIC_GOOGLE_CLIENT_ID = "807159615115-c9q1jc0giet0q2fos0bc7o174psih0t8.apps.googleusercontent.com"

# Single-page app: every route serves index.html (real files are served first).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker and the app manifest must always be checked for a new version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Bundles have content hashes in their names, so they can be cached forever.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # The microphone is used by "Speak & compare"; nothing else is needed.
    Permissions-Policy = "camera=(), geolocation=(), microphone=(self)"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Only the app's own scripts run (no inline scripts), plus Google sign-in and the Cloudflare bot
    # test. The app talks to its Supabase project; styles are inline because React Native Web writes
    # them. Stripe is reached by leaving the page, which this doesn't restrict.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://*.googleusercontent.com https://accounts.google.com; font-src 'self' data:; connect-src 'self' blob: data: https://qbagcpemtsqaoykwqger.supabase.co wss://qbagcpemtsqaoykwqger.supabase.co https://accounts.google.com/gsi/ https://challenges.cloudflare.com; media-src 'self' blob: data: https://qbagcpemtsqaoykwqger.supabase.co; frame-src https://accounts.google.com https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
